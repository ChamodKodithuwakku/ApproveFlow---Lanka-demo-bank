# Local SQL Server 2022 for development.
#   1. Create .env from .env.example (or run scripts/setup-dev.ps1 -Docker, which generates it).
#   2. docker compose up -d
# The container listens on localhost:1433 only. Data persists in the "approveflow-sql" volume.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: approveflow-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - approveflow-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  approveflow-sql:
