name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ApproveFlow.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build ApproveFlow.sln --configuration Release --no-restore

      - name: Test (SQLite in-memory, no SQL Server needed)
        run: >
          dotnet test ApproveFlow.sln --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      - name: Generate idempotent migration script (for DBA review / manual deployment)
        run: |
          dotnet tool restore
          dotnet tool run dotnet-ef migrations script --idempotent --no-build --configuration Release \
            --project src/ApproveFlow.Infrastructure --startup-project src/ApproveFlow.Infrastructure \
            --output ./artifacts/sql/ApproveFlow_Migrations_Idempotent.sql

      - name: Publish web application
        run: dotnet publish src/ApproveFlow.Web/ApproveFlow.Web.csproj --configuration Release --no-build --output ./artifacts/web

      - name: Upload web package
        uses: actions/upload-artifact@v4
        with:
          name: approveflow-web
          path: ./artifacts/web
          retention-days: 14

      - name: Upload migration script
        uses: actions/upload-artifact@v4
        with:
          name: approveflow-sql
          path: ./artifacts/sql
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results
          retention-days: 14

